<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Single-ink variant: the mask and the eyes are holes, so it works on any background.
       Uses currentColor: inline the SVG (or use it as a CSS mask) so it takes the surrounding colour;
       an <img> tag shows it black. -->
  <mask id="m">
    <rect width="100" height="100" fill="#fff"/>
    <path d="M50,28 C46,38 44,44 38,48 C28,50 22,58 24,68 C26,80 38,86 50,86 C62,86 74,80 76,68 C78,58 72,50 62,48 C56,44 54,38 50,28 Z" fill="#000"/>
    <circle cx="35" cy="44" r="5" fill="#000"/>
    <circle cx="65" cy="44" r="5" fill="#000"/>
  </mask>
  <g fill="currentColor" mask="url(#m)">
    <polygon points="14,34 23,4 42,24"/>
    <polygon points="86,34 77,4 58,24"/>
    <rect x="6" y="15" width="88" height="81" rx="18"/>
  </g>
  <ellipse cx="50" cy="66" rx="7" ry="5" fill="currentColor"/>
  <path d="M43,77 Q50,79 57,77" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
